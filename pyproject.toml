[project]
name = "bizops-agents"
version = "0.1.0"
description = "Business-agnostic multi-agent operations assistant: LangGraph supervisor + Ollama + MCP"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "langchain-core>=1.0",
  "langchain-ollama>=1.0",
  "langchain-mcp-adapters>=0.2",
  "mcp>=1.20",
  "aiosqlite>=0.20",
  "pyyaml>=6",
  "croniter>=2.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
[project.scripts]
bizops = "bizops.cli:main"
bizops-office = "bizops.office:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bizops = ["office_ui/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
[tool.ruff]
line-length = 110
